# https://taskfile.dev

version: '3'

vars:
  POSTGRES_USER: shen
  POSTGRES_PASSWORD: shen_dev_password
  POSTGRES_DB: shen
  PORT: "5432"
  POSTGRESQL_URL: 'postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@localhost:{{.PORT}}/{{.POSTGRES_DB}}?sslmode=disable'

tasks:
  db:up:
    desc: Start PostgreSQL database service
    cmds:
      - docker compose up -d postgres

  db:down:
    desc: Stop PostgreSQL database service
    cmds:
      - docker compose down postgres

  db:migrate:up:
    desc: Run all pending database migrations
    deps:
      - db:up
    cmds:
      - migrate -database {{.POSTGRESQL_URL}} -path ./db/migrations up

  db:migrate:down:
    desc: Rollback all database migrations
    deps:
      - db:up
    cmds:
      - migrate -database {{.POSTGRESQL_URL}} -path ./db/migrations down -all

  db:shell:
    desc: Open PostgreSQL shell (psql)
    deps:
      - db:up
    cmds:
      - PGPASSWORD={{.POSTGRES_PASSWORD}} psql -h localhost -p {{.PORT}} -U {{.POSTGRES_USER}} -d {{.POSTGRES_DB}}

  db:reset:
    desc: Reset database schema (down + up migrations)
    cmds:
      - task: db:migrate:down
      - task: db:migrate:up

  db:migrate:create:
    desc: Create a new migration file (usage - task db:migrate:create -- migration_name)
    cmds:
      - migrate create -ext sql -dir db/migrations -seq {{.CLI_ARGS}}

  db:sqlc:generate:
    desc: Generate Go code from SQL queries using sqlc
    cmds:
      - sqlc generate

  test:integration:
    desc: Start database, reset schema, and run integration tests
    deps:
      - db:up
      - db:reset
    cmds:
      - go test -v -tags=integration ./db/tests/...
