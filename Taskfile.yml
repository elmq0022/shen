# https://taskfile.dev

version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all
    silent: true

  db:up:
    desc: Start PostgreSQL database service
    cmds:
      - docker compose up -d --wait postgres

  db:down:
    desc: Stop PostgreSQL database service
    cmds:
      - docker compose down postgres

  db:migrate:up:
    desc: Run all pending database migrations
    cmds:
      - task: db:up
      - migrate -database ${DATABASE_URL} -path ./db/migrations up

  db:migrate:down:
    desc: Rollback all database migrations
    cmds:
      - task: db:up
      - migrate -database ${DATABASE_URL} -path ./db/migrations down -all

  db:shell:
    desc: Open PostgreSQL shell (psql)
    cmds:
      - task: db:up
      - PGPASSWORD=${POSTGRES_PASSWORD} psql -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -U ${POSTGRES_USER} -d ${POSTGRES_DB}

  db:reset:
    desc: Reset database schema (down + up migrations)
    cmds:
      - task: db:up
      - migrate -database ${DATABASE_URL} -path ./db/migrations down -all
      - migrate -database ${DATABASE_URL} -path ./db/migrations up

  db:migrate:create:
    desc: Create a new migration file (usage - task db:migrate:create -- migration_name)
    cmds:
      - migrate create -ext sql -dir db/migrations -seq {{.CLI_ARGS}}

  db:sqlc:generate:
    desc: Generate Go code from SQL queries using sqlc
    cmds:
      - sqlc generate

  test:integration:
    desc: |
      Start database, reset schema, and run integration tests in db/tests
      Examples:
        task test:integration                                    # run all integration tests
        task test:integration -- -run TestCreateAdmin            # run specific test by name
    cmds:
      - task: db:reset
      - go test -v -count=1 -tags=integration ./db/tests {{.CLI_ARGS}}

  test:unit:
    desc: |
      Run unit tests (no database)
      Examples:
        task test:unit                                           # run all unit tests
        task test:unit -- -run TestGetAdmin                      # run specific test by name
        task test:unit -- ./internal/bootstrap/...               # run all tests in package
        task test:unit -- -run TestGetAdminUser ./internal/bootstrap/...  # run specific test in package
    cmds:
      - go test -v ./... {{.CLI_ARGS}}

  test:cli:
    desc: |
      Start database, reset schema, and run CLI integration tests
      Examples:
        task test:cli                                        # run all CLI integration tests
        task test:cli -- -run TestLoginWithDefaultAdmin      # run specific test by name
    cmds:
      - task: db:reset
      - go test -v -count=1 -tags=cli_integration ./tests/integration {{.CLI_ARGS}}

  test:all:
    desc: Run all tests
    cmds:
      - task: test:unit
      - task: test:integration
      - task: test:cli

  dev:
    desc: Start development server (resets DB, runs migrations, starts server)
    cmds:
      - task: db:reset
      - go run ./cmd/shen

  build:shen:
    desc: Build shen binary
    cmds:
      - mkdir -p bin
      - go build -o bin/shen ./cmd/shen

  build:shenctl:
    desc: Build shenctl binary
    cmds:
      - mkdir -p bin
      - go build -o bin/shenctl ./cli/shenctl

  build:
    desc: Build all binaries
    cmds:
      - task: build:shen
      - task: build:shenctl

  clean:
    desc: Clean bin directory
    cmds:
      - rm -rf bin/
